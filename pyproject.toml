[project]
name = "ata"
version = "0.1.0"
description = "Agent Testing Agent — a black-box, outside-in E2E testing framework for conversational agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Bissmella" }]
keywords = ["llm", "agents", "evaluation", "testing", "conversational-ai", "langgraph"]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "jsonpatch>=1.33",
    "jsonpointer>=3.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
# Optional: reach the long tail of STT/TTS providers (and VAD) via Pipecat.
# Not a core dependency — the base library ships only the OpenAI reference.
pipecat = [
    "pipecat-ai>=0.0.40",
]

[project.urls]
Homepage = "https://github.com/Bissmella/ata"
Repository = "https://github.com/Bissmella/ata"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ata", "tests"]
