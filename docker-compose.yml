services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ata
      POSTGRES_USER: ata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ata_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ata"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    volumes:
      - ".:/app"
      - backend_venv:/app/.venv

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run celery -A backend.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ".:/app"
      - celery_venv:/app/.venv

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    profiles:
      - migrate

volumes:
  pgdata:
  minio_data:
  backend_venv:
  celery_venv:
